<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трасса Уклонения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;600&display=swap">
<style>
  /* Layout: одна игровая колонна по центру, HUD поверх холста, экраны старта и финиша поверх игры */
  :root {
    --night: #12161c;      /* фон страницы */
    --asphalt: #2b2f36;    /* дорога */
    --paint: #f2c230;      /* дорожная жёлтая разметка, акцент */
    --chalk: #eef1f4;      /* текст */
    --muted: #9aa3ae;      /* второстепенный текст */
    --panel: rgba(18,22,28,.86);
    --danger: #e5484d;
    --display: "Russo One", "Arial Black", Impact, sans-serif;
    --body: "Rubik", system-ui, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--chalk); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-inline: 16px; box-sizing: border-box; gap: 10px; }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; font-variant-numeric: tabular-nums; }
  .chip { background: var(--panel); border: 1px solid rgba(242,194,48,.35); border-radius: 8px; padding: 5px 10px; text-align: center; min-width: 64px; }
  .chip b { display: block; font-family: var(--display); font-size: 18px; font-weight: 400; color: var(--paint); line-height: 1.1; }
  .chip span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--panel); border: 2px solid var(--paint); border-radius: 14px; padding: 22px 22px; max-width: 300px; width: calc(100% - 32px); text-align: center; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
  .card h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0; color: var(--paint); text-wrap: balance; letter-spacing: .02em; }
  .card p { margin: 0; color: var(--chalk); font-size: 14px; line-height: 1.45; }
  .card .small { color: var(--muted); font-size: 12px; }
  .keys { display: flex; justify-content: center; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  kbd { font-family: var(--display); background: var(--chalk); color: var(--night); border-radius: 5px; padding: 2px 8px; font-size: 14px; box-shadow: 0 2px 0 var(--muted); }
  button { font: inherit; cursor: pointer; }
  .go { font-family: var(--display); font-size: 20px; background: var(--paint); color: var(--night); border: 0; border-radius: 10px; padding: 12px 18px; letter-spacing: .04em; }
  .go:hover { filter: brightness(1.08); }
  .go:focus-visible, .icon:focus-visible, .pad:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
  .big { font-family: var(--display); font-size: 42px; color: var(--chalk); line-height: 1; font-variant-numeric: tabular-nums; }
  .record { color: var(--paint); font-weight: 600; }
  .icon { position: absolute; top: 10px; background: var(--panel); color: var(--chalk); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; width: 38px; height: 38px; font-size: 16px; display: grid; place-items: center; }
  .icon.l { left: 10px; } .icon.r { right: 10px; }
  .pads { display: none; width: 100%; max-width: 420px; gap: 12px; padding-bottom: 8px; }
  .pad { flex: 1; height: 64px; border-radius: 12px; border: 2px solid rgba(242,194,48,.5); background: var(--panel); color: var(--paint); font-family: var(--display); font-size: 28px; touch-action: none; }
  .pad.on { background: var(--paint); color: var(--night); }
  @media (pointer: coarse) { .pads { display: flex; } }
  .stagewrap { position: relative; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="stagewrap" id="box">
      <canvas id="c" aria-label="Игровое поле: вид сверху на дорогу"></canvas>
      <div class="hud" aria-live="off">
        <div class="chip"><b id="hScore">0</b><span>метров</span></div>
        <div class="chip"><b id="hSpeed">0</b><span>км/ч</span></div>
        <div class="chip"><b id="hBest">0</b><span>рекорд</span></div>
      </div>
      <button class="icon l" id="btnPause" title="Пауза (P)" aria-label="Пауза">❚❚</button>
      <button class="icon r" id="btnSound" title="Звук" aria-label="Звук">♪</button>

      <div class="overlay" id="scrStart">
        <div class="card">
          <h1>Трасса Уклонения</h1>
          <p>Слева едут встречные, справа попутные. Объезжай машины, конусы и ремонтные барьеры, собирай монеты.</p>
          <div class="keys"><kbd>←</kbd><kbd>→</kbd> или <kbd>A</kbd><kbd>D</kbd> руль</div>
          <div class="keys"><kbd>P</kbd> пауза</div>
          <button class="go" id="btnStart">Поехали</button>
          <p class="small">На телефоне жми кнопки под дорогой</p>
        </div>
      </div>

      <div class="overlay" id="scrOver" hidden>
        <div class="card">
          <h1>Авария!</h1>
          <div class="big" id="oScore">0 м</div>
          <p id="oInfo"></p>
          <button class="go" id="btnAgain">Ещё раз</button>
          <p class="small">Пробел или Enter, чтобы начать</p>
        </div>
      </div>

      <div class="overlay" id="scrPause" hidden>
        <div class="card">
          <h1>Пауза</h1>
          <button class="go" id="btnResume">Продолжить</button>
        </div>
      </div>
    </div>
  </div>
  <div class="pads">
    <button class="pad" id="padL" aria-label="Влево">◀</button>
    <button class="pad" id="padR" aria-label="Вправо">▶</button>
  </div>
</div>

<script>
(() => {
  const W = 400, H = 700;
  const ROAD_L = 50, ROAD_R = 350, LANES = 4, LANE_W = (ROAD_R - ROAD_L) / LANES;
  const laneX = i => ROAD_L + LANE_W * (i + 0.5);
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const stage = $('stage');

  let scale = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    scale = Math.min(r.width / W, r.height / H);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);

  // ---------- хранение рекорда ----------
  let best = 0;
  try { best = +localStorage.getItem('dodge-best') || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('dodge-best', String(best)); } catch (e) {} }

  // ---------- звук ----------
  let ac = null, muted = false;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function crashSound() {
    if (muted) return; const a = audio(); if (!a) return;
    const len = a.sampleRate * 0.6, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = a.createBufferSource(), g = a.createGain(); g.gain.value = 0.25;
    s.buffer = buf; s.connect(g).connect(a.destination); s.start();
    beep(160, 0.5, 'sawtooth', 0.08, -120);
  }

  // ---------- состояние ----------
  const CAR_COLORS = ['#3f8efc', '#e5484d', '#30a46c', '#f5f5f5', '#8e4ec6', '#f76b15', '#12a594', '#5b5bd6'];
  let state = 'menu'; // menu | play | pause | over
  let player, objs, deco, parts, worldSpeed, dist, coins, spawnT, coinT, shake, roadOff, time, slip;
  const keys = { l: false, r: false };

  function reset() {
    player = { x: laneX(2), y: H - 130, w: 40, h: 72, vx: 0, color: '#f2c230' };
    objs = []; parts = []; deco = [];
    for (let y = -40; y < H + 40; y += 70) addDeco(y);
    worldSpeed = 300; dist = 0; coins = 0; spawnT = 0.6; coinT = 2; shake = 0; roadOff = 0; time = 0; slip = 0;
  }

  function addDeco(y) {
    const left = Math.random() < 0.5;
    const kind = Math.random() < 0.75 ? 'tree' : 'bush';
    deco.push({ x: left ? 8 + Math.random() * 30 : 362 + Math.random() * 30, y, r: kind === 'tree' ? 13 + Math.random() * 6 : 8 + Math.random() * 4, kind });
  }

  // полосы 0,1 — встречные (едут вниз быстрее дороги), 2,3 — попутные (медленнее)
  function laneSpeed(lane, type) {
    if (type !== 'car') return worldSpeed;
    return lane < 2 ? worldSpeed + 140 : worldSpeed * 0.45;
  }

  function spawn() {
    const busy = new Set();
    for (const o of objs) if (o.y < 190 && o.lane != null) busy.add(o.lane);
    const free = [0, 1, 2, 3].filter(l => !busy.has(l));
    if (free.length <= 1) return; // всегда оставляем проезд
    const lane = free[Math.floor(Math.random() * free.length)];
    const r = Math.random();
    const lvl = Math.min(1, dist / 6000);
    if (r < 0.62) {
      const truck = Math.random() < 0.18;
      objs.push({ type: 'car', lane, x: laneX(lane), y: -100, w: truck ? 46 : 40, h: truck ? 110 : 72, truck,
        color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)], down: lane < 2 });
    } else if (r < 0.84) {
      objs.push({ type: 'cone', lane, x: laneX(lane) + (Math.random() * 30 - 15), y: -40, w: 22, h: 22 });
    } else if (r < 0.95 || lvl < 0.3) {
      objs.push({ type: 'barrier', lane, x: laneX(lane), y: -40, w: LANE_W - 10, h: 24 });
    } else {
      objs.push({ type: 'oil', lane, x: laneX(lane), y: -50, w: 50, h: 38 });
    }
  }

  function spawnCoin() {
    const busy = new Set();
    for (const o of objs) if (o.y < 220 && o.lane != null) busy.add(o.lane);
    const free = [0, 1, 2, 3].filter(l => !busy.has(l));
    if (!free.length) return;
    const lane = free[Math.floor(Math.random() * free.length)];
    for (let i = 0; i < 3; i++) objs.push({ type: 'coin', lane, x: laneX(lane), y: -30 - i * 50, w: 22, h: 22 });
  }

  function hit(a, b, pad = 6) {
    return Math.abs(a.x - b.x) * 2 < (a.w + b.w - pad * 2) && Math.abs(a.y - b.y) * 2 < (a.h + b.h - pad * 2);
  }

  function boom(x, y) {
    for (let i = 0; i < 46; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 320;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.7, t: 0,
        c: ['#f2c230', '#f76b15', '#e5484d', '#ffffff', '#555'][i % 5], r: 2 + Math.random() * 4 });
    }
  }

  function sparkle(x, y) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 120;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4, t: 0, c: '#f2c230', r: 2 });
    }
  }

  function update(dt) {
    time += dt;
    // скорость растёт со временем
    worldSpeed = Math.min(880, 300 + dist * 0.045);
    dist += worldSpeed * dt / 10;
    roadOff = (roadOff + worldSpeed * dt) % 60;

    // руль
    const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    const maxV = 330 + worldSpeed * 0.2;
    if (slip > 0) {
      slip -= dt;
      player.vx += Math.sin(time * 14) * 900 * dt;
    }
    player.vx += (dir * maxV - player.vx) * Math.min(1, dt * (slip > 0 ? 2 : 10));
    player.x += player.vx * dt;
    const minX = ROAD_L + player.w / 2 + 3, maxX = ROAD_R - player.w / 2 - 3;
    if (player.x < minX) { player.x = minX; player.vx = 0; }
    if (player.x > maxX) { player.x = maxX; player.vx = 0; }

    // появление
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.32, 0.95 - dist / 9000) * (0.7 + Math.random() * 0.6); }
    coinT -= dt;
    if (coinT <= 0) { spawnCoin(); coinT = 3 + Math.random() * 3; }

    // движение объектов; быстрый не въезжает в медленного в той же полосе
    objs.sort((a, b) => b.y - a.y);
    for (let i = 0; i < objs.length; i++) {
      const o = objs[i];
      let ny = o.y + laneSpeed(o.lane, o.type) * dt;
      if (o.type !== 'coin') {
        for (let j = 0; j < i; j++) {
          const f = objs[j];
          if (f.lane === o.lane && f.type !== 'coin' && f.type !== 'oil' && o.type !== 'oil') {
            const limit = f.y - f.h / 2 - o.h / 2 - 14;
            if (ny > limit && o.y <= limit + 1) ny = Math.max(o.y, limit);
          }
        }
      }
      o.y = ny;
    }
    objs = objs.filter(o => o.y < H + 140 && !o.dead);

    // декор
    for (const d of deco) d.y += worldSpeed * dt;
    deco = deco.filter(d => d.y < H + 40);
    while (deco.length < 24) addDeco(Math.min(...deco.map(d => d.y), H) - 60 - Math.random() * 30);

    // столкновения
    for (const o of objs) {
      if (!hit(player, o, o.type === 'coin' ? 0 : 6)) continue;
      if (o.type === 'coin') { o.dead = true; coins++; dist += 50; sparkle(o.x, o.y); beep(880, 0.08, 'square', 0.05); beep(1320, 0.1, 'square', 0.04); continue; }
      if (o.type === 'oil') { if (slip <= 0) { slip = 0.9; beep(220, 0.3, 'sine', 0.05, 200); } continue; }
      gameOver(o); return;
    }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    parts = parts.filter(p => p.t < p.life);
    shake = Math.max(0, shake - dt * 30);
    updateHud();
  }

  function updateHud() {
    $('hScore').textContent = Math.floor(dist);
    $('hSpeed').textContent = state === 'play' ? Math.round(worldSpeed / 3.2) : 0;
    $('hBest').textContent = Math.floor(best);
  }

  // ---------- рисование ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawCar(x, y, w, h, color, down, truck, tilt = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); if (down) ctx.rotate(Math.PI);
    // тень
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(-w / 2 + 3, -h / 2 + 5, w, h, 9); ctx.fill();
    // колёса
    ctx.fillStyle = '#111';
    const wy = [-h / 2 + 12, h / 2 - 24];
    if (truck) wy.splice(1, 0, h / 2 - 48);
    for (const yy of wy) { ctx.fillRect(-w / 2 - 3, yy, 6, 13); ctx.fillRect(w / 2 - 3, yy, 6, 13); }
    if (truck) {
      ctx.fillStyle = '#cfd4da'; rr(-w / 2, -h / 2 + 30, w, h - 30, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-w / 2 + 3, -h / 2 + 30 + i * (h - 30) / 5); ctx.lineTo(w / 2 - 3, -h / 2 + 30 + i * (h - 30) / 5); ctx.stroke(); }
      ctx.fillStyle = color; rr(-w / 2, -h / 2, w, 28, 6); ctx.fill();
      ctx.fillStyle = '#1d2a38'; rr(-w / 2 + 5, -h / 2 + 4, w - 10, 9, 3); ctx.fill();
      ctx.fillStyle = '#fff6c2'; ctx.fillRect(-w / 2 + 3, -h / 2, 8, 3); ctx.fillRect(w / 2 - 11, -h / 2, 8, 3);
      ctx.restore(); return;
    }
    // кузов
    ctx.fillStyle = color; rr(-w / 2, -h / 2, w, h, 10); ctx.fill();
    // блик
    ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(-w / 2 + 4, -h / 2 + 4, 6, h - 8, 3); ctx.fill();
    // стёкла
    ctx.fillStyle = '#1d2a38';
    rr(-w / 2 + 5, -h / 2 + 15, w - 10, 14, 4); ctx.fill();
    rr(-w / 2 + 6, h / 2 - 22, w - 12, 10, 3); ctx.fill();
    // крыша
    ctx.fillStyle = 'rgba(0,0,0,.12)'; rr(-w / 2 + 6, -h / 2 + 31, w - 12, h - 56, 4); ctx.fill();
    // фары и стопы
    ctx.fillStyle = '#fff6c2'; rr(-w / 2 + 3, -h / 2 + 1, 9, 5, 2); ctx.fill(); rr(w / 2 - 12, -h / 2 + 1, 9, 5, 2); ctx.fill();
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(-w / 2 + 3, h / 2 - 4, 8, 3); ctx.fillRect(w / 2 - 11, h / 2 - 4, 8, 3);
    ctx.restore();
  }

  function drawCone(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(-10, -8, 24, 24, 5); ctx.fill();
    ctx.fillStyle = '#c4510c'; rr(-12, -12, 24, 24, 5); ctx.fill();
    ctx.fillStyle = '#f76b15'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f76b15'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBarrier(o) {
    ctx.save(); ctx.translate(o.x - o.w / 2, o.y - o.h / 2);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(3, 5, o.w, o.h);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, o.w, o.h);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, o.w, o.h); ctx.clip();
    ctx.fillStyle = '#e5484d';
    for (let i = -o.h; i < o.w; i += 16) { ctx.beginPath(); ctx.moveTo(i, o.h); ctx.lineTo(i + 8, o.h); ctx.lineTo(i + 8 + o.h, 0); ctx.lineTo(i + o.h, 0); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = Math.sin(time * 10) > 0 ? '#f2c230' : '#7a5f10';
    ctx.beginPath(); ctx.arc(6, -3, 4, 0, Math.PI * 2); ctx.arc(o.w - 6, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawOil(o) {
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.fillStyle = '#0b0d10';
    ctx.beginPath(); ctx.ellipse(0, 0, o.w / 2, o.h / 2, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, 10, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(120,90,200,.35)'; ctx.beginPath(); ctx.ellipse(-6, -4, 12, 5, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawCoin(o) {
    const s = Math.abs(Math.cos(time * 5 + o.y * 0.01));
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.ellipse(0, 0, 11 * s + 2, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.ellipse(0, 0, 9 * s + 1, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    if (!player) return;
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // трава
    ctx.fillStyle = '#3c6b35'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#35602f';
    for (let y = -60 + roadOff; y < H; y += 60) { ctx.fillRect(0, y, ROAD_L, 30); ctx.fillRect(ROAD_R, y + 30, W - ROAD_R, 30); }
    // обочина
    ctx.fillStyle = '#6b6457'; ctx.fillRect(ROAD_L - 8, 0, 8, H); ctx.fillRect(ROAD_R, 0, 8, H);
    // асфальт
    ctx.fillStyle = '#2b2f36'; ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
    // краевые линии
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(ROAD_L + 3, 0, 3, H); ctx.fillRect(ROAD_R - 6, 0, 3, H);
    // двойная сплошная
    ctx.fillStyle = '#f2c230'; ctx.fillRect(W / 2 - 5, 0, 3, H); ctx.fillRect(W / 2 + 2, 0, 3, H);
    // прерывистые
    ctx.fillStyle = '#e8e8e8';
    for (const lx of [ROAD_L + LANE_W, ROAD_R - LANE_W]) for (let y = -60 + roadOff; y < H; y += 60) ctx.fillRect(lx - 1.5, y, 3, 30);
    // стрелки направления на асфальте
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    for (let y = -240 + (roadOff * 4 % 240); y < H; y += 240) {
      for (let l = 0; l < 4; l++) {
        const x = laneX(l), up = l >= 2;
        ctx.beginPath();
        if (up) { ctx.moveTo(x, y); ctx.lineTo(x - 9, y + 16); ctx.lineTo(x + 9, y + 16); }
        else { ctx.moveTo(x, y + 16); ctx.lineTo(x - 9, y); ctx.lineTo(x + 9, y); }
        ctx.fill();
      }
    }
    // декор
    for (const d of deco) {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(d.x + 4, d.y + 5, d.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = d.kind === 'tree' ? '#1f4d26' : '#4f8a3d'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = d.kind === 'tree' ? '#2e6b33' : '#6aa84f'; ctx.beginPath(); ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.55, 0, Math.PI * 2); ctx.fill();
    }
    // объекты
    for (const o of objs) {
      if (o.type === 'oil') drawOil(o);
    }
    for (const o of objs) {
      if (o.type === 'car') drawCar(o.x, o.y, o.w, o.h, o.color, o.down, o.truck);
      else if (o.type === 'cone') drawCone(o);
      else if (o.type === 'barrier') drawBarrier(o);
      else if (o.type === 'coin') drawCoin(o);
    }
    // игрок
    if (state !== 'over') {
      const tilt = Math.max(-0.25, Math.min(0.25, player.vx / 1600)) + (slip > 0 ? Math.sin(time * 14) * 0.25 : 0);
      drawCar(player.x, player.y, player.w, player.h, player.color, false, false, tilt);
      // полоски гоночные
      ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(tilt);
      ctx.fillStyle = '#12161c'; ctx.fillRect(-5, -player.h / 2 + 2, 3, 12); ctx.fillRect(2, -player.h / 2 + 2, 3, 12);
      ctx.fillRect(-5, -player.h / 2 + 31, 3, player.h - 56); ctx.fillRect(2, -player.h / 2 + 31, 3, player.h - 56);
      ctx.restore();
    }
    // частицы
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // эффект скорости
    if (state === 'play' && worldSpeed > 550) {
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(0.25, (worldSpeed - 550) / 1200) + ')'; ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) { const x = Math.random() * W, y = Math.random() * H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 40); ctx.stroke(); }
    }
    ctx.restore();
  }

  // ---------- цикл ----------
  let last = 0;
  function loop(t) {
    const dt = Math.min(0.033, (t - last) / 1000 || 0);
    last = t;
    if (state === 'play') update(dt);
    else if (state === 'over') {
      time += dt;
      for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
      parts = parts.filter(p => p.t < p.life);
      shake = Math.max(0, shake - dt * 30);
    } else if (state === 'menu') { time += dt; roadOff = (roadOff + 120 * dt) % 60; for (const d of deco) d.y += 120 * dt; deco = deco.filter(d => d.y < H + 40); while (deco.length < 24) addDeco(Math.min(...deco.map(d => d.y), H) - 60 - Math.random() * 30); }
    draw();
    requestAnimationFrame(loop);
  }

  function show(id, on) { $(id).hidden = !on; }

  function start() {
    audio();
    reset(); state = 'play';
    show('scrStart', false); show('scrOver', false); show('scrPause', false);
    beep(440, 0.08); setTimeout(() => beep(660, 0.12), 90);
  }

  function gameOver(o) {
    state = 'over';
    boom(player.x, player.y - player.h / 2); shake = 14; crashSound();
    const prev = best, isRecord = dist > best;
    if (isRecord) { best = dist; saveBest(); }
    $('oScore').textContent = Math.floor(dist) + ' м';
    const what = { car: o.truck ? 'грузовик' : (o.down ? 'встречную машину' : 'попутную машину'), cone: 'конус', barrier: 'барьер' }[o.type] || 'препятствие';
    $('oInfo').innerHTML = (isRecord ? '<span class="record">Новый рекорд!</span><br>' : 'Рекорд: ' + Math.floor(prev) + ' м<br>') +
      'Врезался в ' + what + '. Монет: ' + coins;
    updateHud();
    setTimeout(() => { if (state === 'over') { show('scrOver', true); $('btnAgain').focus(); } }, 700);
  }

  function togglePause() {
    if (state === 'play') { state = 'pause'; show('scrPause', true); $('btnResume').focus(); }
    else if (state === 'pause') { state = 'play'; show('scrPause', false); }
  }

  // ---------- управление ----------
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a' || k === 'ф') { keys.l = true; e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd' || k === 'в') { keys.r = true; e.preventDefault(); }
    else if (k === 'p' || k === 'з' || k === 'escape') { togglePause(); }
    else if ((k === ' ' || k === 'enter') && (state === 'menu' || (state === 'over' && !$('scrOver').hidden))) { e.preventDefault(); start(); }
    else if ((k === ' ' || k === 'enter') && state === 'pause') { e.preventDefault(); togglePause(); }
  });
  document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a' || k === 'ф') keys.l = false;
    if (k === 'arrowright' || k === 'd' || k === 'в') keys.r = false;
  });
  window.addEventListener('blur', () => { keys.l = keys.r = false; if (state === 'play') togglePause(); });

  function bindPad(el, side) {
    const on = e => { e.preventDefault(); keys[side] = true; el.classList.add('on'); };
    const off = e => { keys[side] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
  }
  bindPad($('padL'), 'l'); bindPad($('padR'), 'r');

  // касание половинок холста тоже рулит
  const touches = new Map();
  function syncTouch() { keys.l = [...touches.values()].includes('l'); keys.r = [...touches.values()].includes('r'); }
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const r = canvas.getBoundingClientRect();
    touches.set(e.pointerId, e.clientX - r.left < r.width / 2 ? 'l' : 'r'); syncTouch();
  });
  const endTouch = e => { if (touches.delete(e.pointerId)) syncTouch(); };
  canvas.addEventListener('pointerup', endTouch); canvas.addEventListener('pointercancel', endTouch); canvas.addEventListener('pointerleave', endTouch);

  $('btnStart').addEventListener('click', start);
  $('btnAgain').addEventListener('click', start);
  $('btnResume').addEventListener('click', togglePause);
  $('btnPause').addEventListener('click', () => { if (state === 'play' || state === 'pause') togglePause(); });
  $('btnSound').addEventListener('click', () => { muted = !muted; $('btnSound').textContent = muted ? '✕' : '♪'; $('btnSound').setAttribute('aria-label', muted ? 'Звук выключен' : 'Звук'); });

  reset();
  resize();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
